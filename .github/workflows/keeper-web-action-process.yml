name: keeper-web
env:
  SERVICE: keeper-web
  LAYER: web
  COMPOSE_FILE: keeper-web-compose.yml
  KEEPER_ROOT: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories
  ACTIONS_ROOT: /home/ditar/DataDrive/actions-runner/keeper-actions
  LAYER_DIR: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories/web
  DEST: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories/web/keeper-web
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: ${{ env.DEST }}

      - name: npm install
        working-directory: ${{ env.DEST }}
        env:
          NODE_ENV: development
        run: npm install --include=dev

      - name: npm build
        working-directory: ${{ env.DEST }}
        env:
          NODE_ENV: production
        run: npm run build

      - name: Compose up ${{ env.SERVICE }}
        run: |
          docker compose --project-directory "${{ env.LAYER_DIR }}" \
            --env-file "${{ env.KEEPER_ROOT }}/.env" \
            -f "${{ env.LAYER_DIR }}/${{ env.COMPOSE_FILE }}" \
            up -d --build --no-deps --force-recreate "${{ env.SERVICE }}"

      - name: Remove leftover clone in keeper-actions root
        if: always()
        run: |
          WS="${{ github.workspace }}"
          ROOT="${{ env.ACTIONS_ROOT }}"
          if [ -n "$WS" ] && [ -d "$WS" ] && [ "$(dirname "$WS")" = "$ROOT" ] && [ "$WS" != "${{ env.KEEPER_ROOT }}" ]; then
            echo "Removing leftover workspace $WS"
            rm -rf "$WS"
          fi
